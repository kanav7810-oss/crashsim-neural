[project]
name = "crashsim-neural"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.51.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.13",
  "torch>=2.0",
  "scikit-learn>=1.5",
  "shap>=0.50",
  "plotly>=6.0",
  "reportlab>=5.0",
  "matplotlib>=3.9",
]

[tool.uv]
extra-index-url = "https://download.pytorch.org/whl/cpu"

[tool.vercel]
entrypoint = "api.main:app"