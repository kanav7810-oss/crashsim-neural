<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRASHSIM-NEURAL</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.12 0.006 60);
      --surface: oklch(0.145 0.008 60);
      --surface-2: oklch(0.17 0.01 60);
      --border: oklch(0.22 0.012 60);
      --border-s: oklch(0.28 0.014 60);
      --text: oklch(0.925 0.008 60);
      --text-2: oklch(0.72 0.01 60);
      --muted: oklch(0.57 0.012 60);
      --accent: oklch(0.63 0.11 62);
      --accent-h: oklch(0.69 0.1 64);
      --accent-fill: oklch(0.5 0.1 58);
      --accent-bg: oklch(0.24 0.055 62);
      --ok: oklch(0.72 0.15 150);
      --warn: oklch(0.8 0.15 75);
      --danger: oklch(0.65 0.2 24);
      --secondary: oklch(0.72 0.09 150);
      --radius: 8px;
      --radius-s: 6px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100vh; }
    input, select, button { font-family: inherit; }
    .mono { font-family: var(--mono); font-feature-settings: 'tnum'; letter-spacing: -0.01em; }
    ::selection { background: var(--accent-bg); color: var(--text); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border-s); border-radius: 5px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-s); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
